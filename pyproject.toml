[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-intelligence"
version = "0.1.0"
description = "Phase 1: Local AI Code Intelligence Engine - Multi-Language AST Parsing, Embeddings & Vector Retrieval"
authors = [{ name = "Local AI Code Intelligence Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tree-sitter>=0.20.0,<0.22.0",
    "tree-sitter-languages>=1.10.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "GitPython>=3.1.30",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
