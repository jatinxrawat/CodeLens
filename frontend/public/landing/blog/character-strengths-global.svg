<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Character strengths</title>
  <desc id="description">Twenty-four small tiles in six groups for the 24 character strengths and six virtues, with five highlighted as signature strengths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101638"/>
      <stop offset="1" stop-color="#263675"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <g>
    <rect x="77" y="104" width="1046" height="467" rx="28" fill="#ffffff" fill-opacity=".08" stroke="#c3cdff" stroke-opacity=".26"/>
    <!-- six virtue columns: 5, 4, 3, 3, 4, 5 strengths -->
    <g fill="#8fa0ff" fill-opacity=".35">
      <rect x="137" y="164" width="126" height="56" rx="14"/><rect x="137" y="236" width="126" height="56" rx="14"/><rect x="137" y="308" width="126" height="56" rx="14"/><rect x="137" y="380" width="126" height="56" rx="14"/><rect x="137" y="452" width="126" height="56" rx="14"/>
      <rect x="297" y="164" width="126" height="56" rx="14"/><rect x="297" y="236" width="126" height="56" rx="14"/><rect x="297" y="308" width="126" height="56" rx="14"/><rect x="297" y="380" width="126" height="56" rx="14"/>
      <rect x="457" y="164" width="126" height="56" rx="14"/><rect x="457" y="236" width="126" height="56" rx="14"/><rect x="457" y="308" width="126" height="56" rx="14"/>
      <rect x="617" y="164" width="126" height="56" rx="14"/><rect x="617" y="236" width="126" height="56" rx="14"/><rect x="617" y="308" width="126" height="56" rx="14"/>
      <rect x="777" y="164" width="126" height="56" rx="14"/><rect x="777" y="236" width="126" height="56" rx="14"/><rect x="777" y="308" width="126" height="56" rx="14"/><rect x="777" y="380" width="126" height="56" rx="14"/>
      <rect x="937" y="164" width="126" height="56" rx="14"/><rect x="937" y="236" width="126" height="56" rx="14"/><rect x="937" y="308" width="126" height="56" rx="14"/><rect x="937" y="380" width="126" height="56" rx="14"/><rect x="937" y="452" width="126" height="56" rx="14"/>
    </g>
    <!-- five signature strengths -->
    <g fill="#5b73ff">
      <rect x="137" y="236" width="126" height="56" rx="14"/>
      <rect x="297" y="308" width="126" height="56" rx="14"/>
      <rect x="457" y="164" width="126" height="56" rx="14"/>
      <rect x="937" y="236" width="126" height="56" rx="14"/>
      <rect x="937" y="380" width="126" height="56" rx="14"/>
    </g>
    <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
      <text x="200" y="273">1</text><text x="360" y="345">2</text><text x="520" y="201">3</text><text x="1000" y="273">4</text><text x="1000" y="417">5</text>
    </g>
  </g>
</svg>
